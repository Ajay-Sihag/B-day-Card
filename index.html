<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Happy Birthday Jashan ✨</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #12091d;
            --bg2: #21102f;
            --pink: #ff4f81;
            --pink-light: #ff91ae;
            --purple: #b78cff;
            --gold: #ffd166;
            --white: #fff7fb;
            --muted: #d8cbdc;
            --glass: rgba(255, 255, 255, 0.075);
            --border: rgba(255, 255, 255, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(circle at 20% 15%, rgba(183, 140, 255, 0.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(255, 79, 129, 0.14), transparent 30%),
                linear-gradient(145deg, var(--bg), var(--bg2));

            color: var(--white);
            font-family: 'Poppins', sans-serif;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: drift 10s ease-in-out infinite alternate;
        }

        .glow.one {
            width: 180px;
            height: 180px;
            background: var(--pink);
            top: -70px;
            left: -60px;
        }

        .glow.two {
            width: 220px;
            height: 220px;
            background: var(--purple);
            right: -100px;
            bottom: -80px;
            animation-delay: 2s;
        }

        .glow.three {
            width: 120px;
            height: 120px;
            background: var(--gold);
            left: 45%;
            top: 40%;
            opacity: 0.08;
            animation-delay: 4s;
        }

        @keyframes drift {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(25px, -20px) scale(1.15);
            }
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            font-size: 12px;
            opacity: 0;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(105vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* =========================
           MAIN PHONE
        ========================= */

        .phone-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 900px;
            margin: auto;
            overflow: hidden;
            z-index: 2;
        }

        /* =========================
           SOUND BUTTON
        ========================= */

        .sound-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 1000;

            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: 1px solid var(--border);

            background: rgba(255,255,255,0.09);
            backdrop-filter: blur(10px);

            color: white;
            font-size: 18px;

            cursor: pointer;

            transition: 0.25s;
        }

        .sound-toggle:hover {
            transform: scale(1.08);
            background: rgba(255,255,255,0.15);
        }

        /* =========================
           SCREENS
        ========================= */

        .screen {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 55px 24px 30px;

            opacity: 0;
            pointer-events: none;

            transform: translateY(25px) scale(0.98);

            transition:
                opacity 0.65s ease,
                transform 0.65s cubic-bezier(.2,.8,.2,1);

            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.1rem, 14vw, 4.2rem);
            line-height: 1;
            margin-bottom: 14px;

            color: white;

            text-shadow:
                0 0 12px rgba(255,79,129,0.7),
                0 0 35px rgba(183,140,255,0.35);
        }

        h2 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        p {
            max-width: 360px;

            font-size: 1rem;
            line-height: 1.7;

            color: var(--muted);

            margin-bottom: 22px;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            border: none;

            padding: 14px 27px;

            border-radius: 999px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--pink),
                    #ff6c99,
                    var(--purple)
                );

            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(255,79,129,0.25),
                inset 0 1px rgba(255,255,255,0.25);

            transition: 0.25s;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow:
                0 12px 30px rgba(255,79,129,0.4);
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* =========================
           ICON
        ========================= */

        .icon-large {
            font-size: 5.5rem;
            margin-bottom: 22px;
            user-select: none;
        }

        .float {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* =========================
           TYPING
        ========================= */

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--pink-light);
            margin-left: 3px;
            vertical-align: middle;

            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* =========================
           YES / NO
        ========================= */

        .btn-group {
            position: relative;

            width: 100%;
            height: 110px;

            margin-top: 5px;
        }

        #btn-yes,
        #btn-no {
            position: absolute;
            top: 15px;
        }

        #btn-yes {
            left: 7%;
        }

        #btn-no {
            right: 7%;
            background: rgba(255,255,255,0.1);
            box-shadow: none;
        }

        /* =========================
           BALLOONS
        ========================= */

        .balloon-area {
            position: relative;

            width: 100%;
            max-width: 360px;

            height: 300px;

            margin-top: 10px;
        }

        .balloons-wrapper {
            position: absolute;
            inset: 0;

            display: flex;
            flex-wrap: wrap;

            justify-content: center;
            align-content: center;

            gap: 18px;

            z-index: 3;
        }

        .balloon-item {
            position: relative;

            width: 105px;
            height: 125px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 4.6rem;

            cursor: pointer;
            user-select: none;

            transition:
                transform 0.25s ease,
                opacity 0.35s ease;
        }

        .balloon-item:hover {
            transform: translateY(-6px) scale(1.04);
        }

        .balloon-item.popping {
            animation: balloonPop 0.42s forwards;
            pointer-events: none;
        }

        @keyframes balloonPop {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            35% {
                transform: scale(1.25);
            }

            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        .revealed-word {
            position: absolute;

            transform: translate(-50%, -50%) scale(0.5);

            color: white;

            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;

            font-weight: 700;

            text-shadow:
                0 0 12px var(--pink),
                0 0 25px rgba(255,79,129,0.5);

            opacity: 0;

            animation: wordReveal 0.65s cubic-bezier(.2,.8,.2,1) forwards;

            pointer-events: none;

            white-space: nowrap;

            z-index: 5;
        }

        @keyframes wordReveal {
            0% {
                opacity: 0;
                transform: translate(-50%, -30%) scale(0.5);
            }

            60% {
                opacity: 1;
                transform: translate(-50%, -60%) scale(1.1);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .balloon-complete {
            animation: glowText 1.5s ease-in-out infinite alternate;
        }

        @keyframes glowText {
            from {
                text-shadow: 0 0 10px var(--pink);
            }

            to {
                text-shadow:
                    0 0 18px var(--pink),
                    0 0 35px var(--purple);
            }
        }

        /* =========================
           HINT
        ========================= */

        .hint {
            margin-top: 10px;

            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;

            color: rgba(255,255,255,0.45);

            animation: hintPulse 2s infinite;
        }

        @keyframes hintPulse {
            50% {
                opacity: 0.45;
            }
        }

        /* =========================
           CAKE
        ========================= */

        #candle {
            cursor: pointer;
            transition: 0.3s;
        }

        #candle:hover {
            transform: scale(1.08);
        }

        .wish-message {
            opacity: 0;
            transform: translateY(10px);
            transition: 0.6s;
            color: var(--gold);
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
        }

        .wish-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           BOUQUET
        ========================= */

        .bouquet-grid {
            width: 100%;
            max-width: 370px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 10px;

            margin: 8px 0 18px;
        }

        .note-card {
            min-height: 67px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px;

            border-radius: 17px;

            border: 1px solid rgba(255,79,129,0.25);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0.035)
                );

            backdrop-filter: blur(8px);

            color: var(--white);

            font-size: 0.78rem;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.25s,
                background 0.25s,
                border 0.25s;
        }

        .note-card:hover {
            transform: translateY(-3px);
        }

        .note-card.revealed {
            background: rgba(255,79,129,0.16);
            border-color: rgba(255,79,129,0.7);

            transform: scale(1.025);

            box-shadow:
                0 8px 25px rgba(255,79,129,0.12);
        }

        .note-card:last-child {
            grid-column: 1 / -1;

            border-color: rgba(255,209,102,0.35);
        }

        /* =========================
           LETTER
        ========================= */

        .glass-card {
            width: 100%;
            max-width: 380px;

            max-height: 67vh;

            overflow-y: auto;

            padding: 28px 21px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0.045)
                );

            border: 1px solid var(--border);

            backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);
        }

        .glass-card::-webkit-scrollbar {
            width: 4px;
        }

        .glass-card::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .letter-title {
            color: var(--pink-light);

            font-family: 'Dancing Script', cursive;

            font-size: 2.5rem;

            text-align: center;

            margin-bottom: 20px;

            text-shadow:
                0 0 15px rgba(255,79,129,0.45);
        }

        .letter-paragraph {
            opacity: 0;
            transform: translateY(12px);

            animation: letterAppear 0.7s forwards;
        }

        .letter-paragraph:nth-of-type(1) {
            animation-delay: 0.15s;
        }

        .letter-paragraph:nth-of-type(2) {
            animation-delay: 0.45s;
        }

        .letter-paragraph:nth-of-type(3) {
            animation-delay: 0.75s;
        }

        .letter-paragraph:nth-of-type(4) {
            animation-delay: 1.05s;
        }

        .letter-paragraph:nth-of-type(5) {
            animation-delay: 1.35s;
        }

        @keyframes letterAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .letter-signature {
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: var(--pink-light);
        }

        /* =========================
           FINAL SCREEN
        ========================= */

        .final-heart {
            font-size: 4rem;

            animation:
                heartbeat 1.3s infinite,
                floating 3s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            20% {
                transform: scale(1.15);
            }

            35% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .final-message {
            color: var(--muted);
        }

        /* =========================
           CONFETTI
        ========================= */

        .confetti {
            position: fixed;

            width: 8px;
            height: 13px;

            z-index: 2000;

            pointer-events: none;

            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);
                opacity: 0;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-height: 700px) {

            .screen {
                padding-top: 48px;
                padding-bottom: 18px;
            }

            .icon-large {
                font-size: 4.5rem;
                margin-bottom: 12px;
            }

            h1 {
                font-size: 3rem;
            }

            h2 {
                font-size: 1.25rem;
                margin-bottom: 10px;
            }

            p {
                font-size: 0.9rem;
                line-height: 1.5;
                margin-bottom: 15px;
            }

            .balloon-area {
                height: 250px;
            }

            .balloon-item {
                width: 90px;
                height: 100px;
                font-size: 3.8rem;
            }

            .glass-card {
                max-height: 64vh;
                padding: 22px 18px;
            }

            .bouquet-grid {
                gap: 7px;
            }

            .note-card {
                min-height: 58px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="background-glow">
        <div class="glow one"></div>
        <div class="glow two"></div>
        <div class="glow three"></div>
    </div>

    <div class="particles" id="particles"></div>

    <div class="phone-container">

        <!-- Sound -->
        <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>

        <!-- =========================
             SCREEN 1
        ========================== -->

        <div class="screen active" id="screen0">

            <div class="icon-large float">✨</div>

            <h1>Hey Jashan</h1>

            <p id="welcomeText"></p>

            <button class="btn" onclick="nextScreen()">
                Ugh, fine. Open it.
            </button>

        </div>


        <!-- =========================
             SCREEN 2
        ========================== -->

        <div class="screen" id="screen1">

            <h2>Before we proceed...</h2>

            <p>
                You have to admit it.
                Am I the absolute best and most favorite person in your life?
            </p>

            <div class="btn-group">

                <button
                    class="btn"
                    id="btn-yes"
                    onclick="yesAnswer()">
                    Yes, obviously!
                </button>

                <button
                    class="btn"
                    id="btn-no"
                    onmouseover="moveNo()"
                    ontouchstart="moveNo()"
                    onclick="moveNo()">
                    No
                </button>

            </div>
